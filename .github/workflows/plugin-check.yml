name: WordPress Plugin Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          # The repository directory is holvek-wp. The distributed slug and text domain are holvek.
          # These paths are development files. package-zip.sh already omits them from the release zip.
          slug: holvek
          exclude-directories: 'vendor,node_modules,tests,.github,dist,build,assets,scripts'
          exclude-files: '.svnignore,.gitignore,phpcs.xml.dist,phpunit.xml.dist,package-zip.sh,deploy-to-wporg.sh'
