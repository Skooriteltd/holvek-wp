name: Release package

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build reproducible plugin archive
        run: ./package-zip.sh

      - name: Test ZIP installation in temporary WordPress
        run: |
          npm -g install @wordpress/env
          ZIP_FILE="$(pwd)/$(ls dist/holvek-*.zip | head -n 1)"
          # wp-env supports installing from a local ZIP file
          echo "{\"core\": \"WordPress/WordPress#master\", \"plugins\": [\"${ZIP_FILE}\"]}" > .wp-env.json
          wp-env start
          
          # Verify activation and check for fatal errors
          wp-env run cli wp plugin is-active holvek || wp-env run cli wp plugin activate holvek
          
          # Verify the tables were created successfully
          wp-env run cli wp db query "SHOW TABLES LIKE '%holvek%';" | grep holvek
          
          wp-env stop

      - name: Upload package and manifest
        uses: actions/upload-artifact@v4
        with:
          name: holvek-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.manifest.sha256
          if-no-files-found: error
