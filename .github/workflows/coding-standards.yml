name: Coding Standards

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  wpcs:
    name: PHP_CodeSniffer (WPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

  plugin-check:
    name: WordPress Plugin Check (PCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '.'
          # The repository directory is holvek-wp. The distributed slug and text domain are holvek.
          # These paths are development files. package-zip.sh already omits them from the release zip.
          slug: holvek
          exclude-directories: 'vendor,node_modules,tests,.github,dist,scripts'
          exclude-files: '.svnignore,.gitignore,phpcs.xml.dist,phpunit.xml.dist,package-zip.sh,deploy-to-wporg.sh'
